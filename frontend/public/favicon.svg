<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favicon-grad-ribbon" x1="8" y1="14" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64F9BC" />
      <stop offset="40%" stop-color="#34D399" />
      <stop offset="75%" stop-color="#059669" />
      <stop offset="100%" stop-color="#004D36" />
    </linearGradient>
    <linearGradient id="favicon-grad-depth" x1="14" y1="48" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00261D" />
      <stop offset="100%" stop-color="#004D36" />
    </linearGradient>
  </defs>

  <!-- Background rounded badge for high visibility in browser tabs -->
  <rect width="64" height="64" rx="16" fill="#003629" />
  <rect width="64" height="64" rx="16" stroke="#34D399" stroke-opacity="0.3" stroke-width="2" />

  <!-- Under-pass loop -->
  <path
    d="M16 40 C14 26, 26 20, 34 29 C40 37, 48 40, 52 32 C55 26, 52 18, 44 18"
    stroke="url(#favicon-grad-depth)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Foreground continuous ribbon forming W & S fold -->
  <path
    d="M10 22 C13 14, 21 15, 23 25 L28 43 C29.5 48, 33.5 48, 35 43 L40 28 C42 22, 47 21, 51 26 C55 31, 53 43, 44 46 C35 49, 29 39, 22 39 C15 39, 11 32, 10 22 Z"
    fill="url(#favicon-grad-ribbon)"
  />

  <!-- Highlight stroke -->
  <path
    d="M23 25 L28 43 C29 46.5, 31.5 47, 33 44"
    stroke="#A7F3D0"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Apex Spark -->
  <circle cx="51" cy="26" r="2.5" fill="#FFFFFF" />
  <circle cx="51" cy="26" r="4.5" fill="#64F9BC" opacity="0.4" />
</svg>
